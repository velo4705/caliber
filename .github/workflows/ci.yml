name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate registry and expression engine
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual check
        run: |
          npx vite preview --port 5199 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5199/ >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:5199 npm run verify

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: web/screenshots
          retention-days: 7