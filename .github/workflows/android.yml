name: Android Build

on:
  workflow_dispatch:

env:
  APP_NAME: Caliber
  VERSION: "2.0.0"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # Remove pre-installed incompatible platforms from runner
          rm -rf $ANDROID_HOME/platforms/android-35* $ANDROID_HOME/platforms/android-36*
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"
          echo "Installed platforms:"
          ls $ANDROID_HOME/platforms/

      - name: Install Qt6 (host + android)
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop 6.7.3 linux_gcc_64 --modules qtcharts --outputdir /opt/Qt
          aqt install-qt linux android 6.7.3 android_arm64_v8a --modules qtcharts --outputdir /opt/Qt

      - name: Configure
        env:
          QT_HOST_PATH: /opt/Qt/6.7.3/gcc_64
          QT_HOST_PATH_CMAKE_DIR: /opt/Qt/6.7.3/gcc_64/lib/cmake
        run: |
          echo "Host Qt cmake dir:"
          ls /opt/Qt/6.7.3/gcc_64/lib/cmake/ 2>/dev/null | head -5
          ls /opt/Qt/6.7.3/gcc_64/lib/cmake/Qt6/Qt6Config.cmake 2>/dev/null || echo "Qt6Config.cmake NOT FOUND"
          mkdir build_android
          cmake -S . -B build_android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DCMAKE_PREFIX_PATH="/opt/Qt/6.7.3/android_arm64_v8a/lib/cmake/Qt6" \
            -DCMAKE_FIND_ROOT_PATH="/opt/Qt/6.7.3/android_arm64_v8a" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQT_HOST_PATH_CMAKE_DIR="$QT_HOST_PATH_CMAKE_DIR" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build library
        run: cmake --build build_android --target caliber --parallel $(nproc)

      - name: Build APK
        run: |
          mkdir -p build_android/android-build/libs/arm64-v8a
          cp build_android/libcaliber_arm64-v8a.so build_android/android-build/libs/arm64-v8a/
          echo "android.useAndroidX=true" > build_android/android-build/gradle.properties
          /opt/Qt/6.7.3/gcc_64/bin/androiddeployqt \
            --input build_android/android-caliber-deployment-settings.json \
            --output build_android/android-build \
            --apk build_android/caliber.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build_android/caliber.apk
          retention-days: 30
