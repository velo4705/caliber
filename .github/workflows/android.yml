name: Android Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME: Caliber
  VERSION: "2.0.0"
  ANDROID_API: 34
  NDK_VERSION: 26.1.10909125

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;34.0.0" \
            "ndk;${{ env.NDK_VERSION }}"

      - name: Install Qt6 for Android
        id: qt-install
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtcharts qtdatavis3d'
          cache: true

      - name: Debug Qt paths
        run: |
          echo "Qt6_DIR=$Qt6_DIR"
          echo "AQT_INSTALL_DIR=$AQT_INSTALL_DIR"
          ls "$Qt6_DIR" 2>/dev/null || echo "Qt6_DIR not found"
          find /opt/hostedtoolcache/Qt -name "Qt6Config.cmake" 2>/dev/null | head -5
          find /home -name "Qt6Config.cmake" 2>/dev/null | head -5

      - name: Configure
        run: |
          mkdir build_android
          cmake -S . -B build_android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_android --parallel $(nproc)

      - name: Build APK
        run: |
          ANDROIDDEPLOYQT=$(find "$Qt6_DIR/../.." -name androiddeployqt -type f | head -1)
          echo "androiddeployqt: $ANDROIDDEPLOYQT"
          "$ANDROIDDEPLOYQT" \
            --input build_android/android-caliber-deployment-settings.json \
            --output build_android/android-build \
            --apk build_android/caliber.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build_android/caliber.apk
          retention-days: 30

      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API }}
          target: google_apis
          arch: arm64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install build_android/caliber.apk
            adb shell am start -n com.caliber.app/org.qtproject.qt.android.bindings.QtActivity
            sleep 10
            adb exec-out screencap -p > build_android/screenshot.png
            echo "App launched successfully"

      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Emulator-Screenshot
          path: build_android/screenshot.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build_android/caliber.apk
