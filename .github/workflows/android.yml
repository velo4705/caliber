name: Android Build

on:
  workflow_dispatch:

env:
  APP_NAME: Caliber
  VERSION: "2.0.0"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"

      - name: Install host Qt6 for Linux
        id: qt-host
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          target: 'desktop'
          modules: 'qtcharts'

      - name: Install Qt6 for Android
        run: |
          pip install aqtinstall
          aqt install-qt linux android 6.7.3 android_arm64_v8a \
            --modules qtcharts --outputdir /opt/Qt

      - name: Configure
        run: |
          HOST_PREFIX="$(dirname "$(dirname "$(dirname "${{ steps.qt-host.outputs.Qt6_DIR }}")")")"
          echo "Host Qt prefix: $HOST_PREFIX"
          echo "Host Qt6_DIR: ${{ steps.qt-host.outputs.Qt6_DIR }}"
          mkdir build_android
          cmake -S . -B build_android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DCMAKE_PREFIX_PATH="/opt/Qt/6.7.3/android_arm64_v8a/lib/cmake/Qt6" \
            -DCMAKE_FIND_ROOT_PATH="/opt/Qt/6.7.3/android_arm64_v8a" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DQT_HOST_PATH="$HOST_PREFIX" \
            -DQT_HOST_PATH_CMAKE_DIR="$HOST_PREFIX/lib/cmake" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build library
        run: cmake --build build_android --target caliber --parallel $(nproc)

      - name: Build APK
        run: |
          HOST_PREFIX="$(dirname "$(dirname "$(dirname "${{ steps.qt-host.outputs.Qt6_DIR }}")")")"
          mkdir -p build_android/android-build/libs/arm64-v8a
          cp build_android/libcaliber_arm64-v8a.so build_android/android-build/libs/arm64-v8a/
          "$HOST_PREFIX/bin/androiddeployqt" \
            --input build_android/android-caliber-deployment-settings.json \
            --output build_android/android-build \
            --apk build_android/caliber.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build_android/caliber.apk
          retention-days: 30
