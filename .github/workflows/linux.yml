name: Linux Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME: Caliber
  VERSION: "2.0.0"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-charts-dev qt6-datavis3d-dev \
            libqt6opengl6-dev libqt6network6-dev cmake ninja-build dpkg-dev rpm

      - name: Configure
        run: |
          mkdir build
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          mkdir -p ../dist
          mv *.deb ../dist/

      - name: Package .rpm
        run: |
          cd build
          cpack -G RPM
          mv *.rpm ../dist/

      - name: Package .tar.gz
        run: |
          cd build
          cpack -G TGZ
          mv *.tar.gz ../dist/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Packages
          path: dist/
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
