name: Windows Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME: Caliber
  VERSION: "2.0.0"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtcharts qtdatavis3d'

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build_win -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        shell: cmd
        run: cmake --build build_win --config Release --parallel

      - name: Deploy Qt dependencies
        shell: cmd
        run: |
          mkdir dist\win64
          copy build_win\Release\caliber.exe dist\win64\
          windeployqt --no-translations --no-system-d3d-compiler ^
            --dir dist\win64 dist\win64\caliber.exe

      - name: Upload portable zip
        shell: powershell
        run: |
          Compress-Archive -Path "dist\win64\*" -DestinationPath "dist\${{ env.APP_NAME }}-${{ env.VERSION }}-Windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable
          path: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-Windows-x64.zip
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-Windows-x64.zip
