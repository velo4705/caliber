name: Windows Build

on:
  workflow_dispatch:

env:
  APP_NAME: Caliber
  VERSION: "2.0.0"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtcharts'

      - name: Install NSIS
        shell: powershell
        run: |
          # Use a direct NSIS download from a reliable mirror
          Invoke-WebRequest -Uri "https://github.com/kichik/nsis-build/releases/download/v3.10/nsis-3.10-setup.exe" -OutFile nsis-setup.exe
          Start-Process -Wait -FilePath nsis-setup.exe -ArgumentList '/S', '/D=C:\nsis'
          echo "C:\nsis" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify NSIS
        shell: cmd
        run: makensis /VERSION

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt dependencies
        shell: cmd
        run: |
          mkdir dist\win64
          copy build\Release\caliber.exe dist\win64\
          windeployqt --no-translations --no-system-d3d-compiler ^
            --dir dist\win64 dist\win64\caliber.exe

      - name: Copy NSIS installer script
        shell: cmd
        run: copy windows\installer.nsi dist\win64\

      - name: Build NSIS installer
        shell: cmd
        run: |
          cd dist\win64
          makensis installer.nsi

      - name: Create portable zip
        shell: powershell
        run: |
          Compress-Archive -Path "dist\win64\*" -DestinationPath "dist\${{ env.APP_NAME }}-${{ env.VERSION }}-Windows-x64.zip"

      - name: List outputs
        shell: cmd
        run: dir dist\

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-Setup.exe
          retention-days: 30

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable
          path: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-Windows-x64.zip
          retention-days: 30
