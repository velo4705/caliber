name: Windows Build

on:
  workflow_dispatch:

# Windows builds are done locally:
#   windows\build.bat C:\Qt\6.8.0\msvc2019_64
#
# Or cross-compile on Linux:
#   cd build_win && cmake .. -DCMAKE_TOOLCHAIN_FILE=../windows/mingw64-toolchain.cmake ...

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Windows builds are done locally."
          echo "  windows\build.bat C:\Qt\6.8.0\msvc2019_64"
          echo "Produces: Caliber-2.0.0-Windows-x64.zip"
