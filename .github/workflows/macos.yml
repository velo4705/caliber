name: macOS Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME: Caliber
  VERSION: "2.0.0"

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install qt create-dmg librsvg

      - name: Configure
        run: |
          mkdir build_mac
          cmake -S . -B build_mac \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)/lib/cmake/Qt6" \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build
        run: cmake --build build_mac --parallel $(sysctl -n hw.logicalcpu)

      - name: Create .app bundle
        run: |
          APP_DIR="build_mac/${APP_NAME}.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp build_mac/caliber "$APP_DIR/Contents/MacOS/${APP_NAME}"

          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
              "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>             <string>Caliber</string>
              <key>CFBundleDisplayName</key>      <string>Caliber</string>
              <key>CFBundleIdentifier</key>       <string>com.caliber.app</string>
              <key>CFBundleVersion</key>          <string>2.0.0</string>
              <key>CFBundleShortVersionString</key><string>2.0.0</string>
              <key>CFBundleExecutable</key>       <string>Caliber</string>
              <key>CFBundleIconFile</key>         <string>caliber</string>
              <key>CFBundlePackageType</key>      <string>APPL</string>
              <key>NSHighResolutionCapable</key>  <true/>
              <key>NSRequiresAquaSystemAppearance</key><false/>
          </dict>
          </plist>
          PLIST

          # Generate .icns from SVG
          ICONSET="build_mac/caliber.iconset"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 64 128 256 512; do
              rsvg-convert -w $SIZE -h $SIZE resources/icons/caliber.svg -o "$ICONSET/icon_${SIZE}x${SIZE}.png"
              rsvg-convert -w $((SIZE*2)) -h $((SIZE*2)) resources/icons/caliber.svg -o "$ICONSET/icon_${SIZE}x${SIZE}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/caliber.icns"

      - name: macdeployqt
        run: |
          # macdeployqt may warn about optional QML deps (QtPdf, QtSvg, etc.)
          # These are not fatal — the app works fine without them.
          $(brew --prefix qt)/bin/macdeployqt "build_mac/${APP_NAME}.app" -no-strip || true

      - name: Smoke test (launch check)
        run: |
          # Verify all required frameworks are bundled
          APP_BIN="build_mac/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"
          echo "=== Linked frameworks ==="
          otool -L "$APP_BIN" | head -20
          echo ""
          echo "=== Frameworks in bundle ==="
          ls build_mac/${APP_NAME}.app/Contents/Frameworks/ 2>/dev/null || echo "(none)"
          echo ""
          echo "=== Attempting launch (headless, expect timeout) ==="
          timeout 5 open -W build_mac/${APP_NAME}.app 2>&1 || echo "Launch timed out (expected - no display)"

      - name: Build .dmg
        run: |
          mkdir -p dist
          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 175 190 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 425 190 \
            "dist/${APP_NAME}-${VERSION}.dmg" \
            "build_mac/${APP_NAME}.app"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: dist/${{ env.APP_NAME }}-${{ env.VERSION }}.dmg
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}-${{ env.VERSION }}.dmg
