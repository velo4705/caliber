name: iOS Build

on:
  workflow_dispatch:

# iOS builds require a Mac with Qt6 for iOS — cannot build in CI.
# Build locally:
#   brew install qt
#   bash package/build_ios.sh

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "iOS builds require a Mac with Qt6 for iOS."
          echo "Cannot cross-compile in CI (Homebrew Qt6 has macOS-only headers)."
          echo ""
          echo "Build locally on your Mac:"
          echo "  brew install qt"
          echo "  bash package/build_ios.sh"
          echo ""
          echo "Produces: dist/Caliber-2.0.0-iOS.ipa"
