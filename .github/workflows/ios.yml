name: iOS Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME: Caliber
  VERSION: "2.0.0"
  IOS_DEPLOYMENT_TARGET: '16.0'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          brew install qt
          QT_PREFIX=$(brew --prefix qt)
          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$QT_PREFIX/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "Installed Qt at: $QT_PREFIX"
          ls "$QT_PREFIX/lib/cmake/Qt6/" 2>/dev/null | head -10

      - name: Configure (Simulator)
        run: |
          echo "Using Qt6_DIR: $Qt6_DIR"
          IOS_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "iOS SDK: $IOS_SDK"

          # Bridge GL/gl.h → OpenGLES/gl.h for iOS (Qt headers reference desktop GL)
          GL_DIR="$IOS_SDK/usr/include/GL"
          sudo mkdir -p "$GL_DIR"
          echo '#include <OpenGLES/ES3/gl.h>' | sudo tee "$GL_DIR/gl.h" > /dev/null

          mkdir build_ios_sim
          cmake -S . -B build_ios_sim \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_DEPLOYMENT_TARGET }} \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
            -DCMAKE_FIND_ROOT_PATH="$Qt6_DIR/../../" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (Simulator)
        run: cmake --build build_ios_sim --parallel $(sysctl -n hw.logicalcpu)

      - name: Boot simulator and test
        run: |
          SIM_UDID=$(xcrun simctl list devices available | grep "iPhone 16" | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$SIM_UDID" ]; then
            SIM_UDID=$(xcrun simctl create "TestDevice" "iPhone 16" "iOS")
          fi
          echo "Using simulator: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          sleep 3

          APP_PATH="build_ios_sim/${APP_NAME}.app"
          if [ -d "$APP_PATH" ]; then
            echo "Installing app..."
            xcrun simctl install booted "$APP_PATH"
            echo "Launching app..."
            xcrun simctl launch booted com.caliber.app || echo "Launch returned non-zero (expected for GUI app in CI)"
            sleep 5

            echo "Taking screenshot..."
            xcrun simctl io booted screenshot "build_ios_sim/screenshot.png" 2>/dev/null || echo "Screenshot failed"
            echo "Shutting down simulator..."
            xcrun simctl shutdown booted 2>/dev/null || true
            echo "Simulator test complete."
          else
            echo "WARNING: .app not found at $APP_PATH"
            ls build_ios_sim/ || true
          fi

      - name: Configure (Device)
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          # Bridge GL/gl.h → OpenGLES/gl.h for iOS
          GL_DIR="$IOS_SDK/usr/include/GL"
          sudo mkdir -p "$GL_DIR"
          echo '#include <OpenGLES/ES3/gl.h>' | sudo tee "$GL_DIR/gl.h" > /dev/null

          mkdir build_ios
          cmake -S . -B build_ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_DEPLOYMENT_TARGET }} \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
            -DCMAKE_FIND_ROOT_PATH="$Qt6_DIR/../../" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_BUILD_TYPE=Release \
            -GXcode

      - name: Build (Device)
        run: cmake --build build_ios --config Release

      - name: Create IPA
        run: |
          mkdir -p dist
          APP_PATH="build_ios/Release-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build_ios -name "${APP_NAME}.app" -path "*/Release-iphoneos/*" | head -1)
          fi
          if [ -d "$APP_PATH" ]; then
            mkdir -p build_ios/Payload
            cp -R "$APP_PATH" build_ios/Payload/
            cd build_ios
            zip -r "../dist/${APP_NAME}-${VERSION}-iOS.ipa" Payload/
          else
            echo "WARNING: Device .app not found"
          fi

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-Simulator-Screenshot
          path: build_ios_sim/screenshot.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: hashFiles('dist/*.ipa') != ''
        with:
          name: iOS-IPA
          path: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-iOS.ipa
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('dist/*.ipa') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-iOS.ipa
