name: iOS Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME: Caliber
  VERSION: "2.0.0"
  QT_VERSION: '6.8.*'
  IOS_DEPLOYMENT_TARGET: '16.0'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: 'ios'
          modules: 'qtcharts qtdatavis3d'

      - name: Configure
        run: |
          mkdir build_ios
          cmake -S . -B build_ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_DEPLOYMENT_TARGET }} \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -GXcode

      - name: Build
        run: cmake --build build_ios --config Release

      - name: Create IPA
        run: |
          mkdir -p dist
          APP_PATH="build_ios/Release-iphoneos/${APP_NAME}.app"
          mkdir -p build_ios/Payload
          cp -R "$APP_PATH" build_ios/Payload/
          cd build_ios
          zip -r "../dist/${APP_NAME}-${VERSION}-iOS.ipa" Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-iOS.ipa
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-iOS.ipa
